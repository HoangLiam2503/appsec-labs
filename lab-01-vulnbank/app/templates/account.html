<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VulnBank — Account #{{ acc['id'] }}</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;
         padding:2rem}
    .card{background:#1e293b;padding:1.5rem 2rem;border-radius:12px;
          max-width:480px}
    .row{display:flex;justify-content:space-between;padding:.4rem 0;
         border-bottom:1px solid #334155}
    .label{color:#94a3b8}
    a{color:#60a5fa}
    .mine{color:#4ade80;font-size:.8rem}
  </style>
</head>
<body>
  <div class="card">
    <h1>Account #{{ acc['id'] }}
      {% if acc['id'] == me %}<span class="mine">(you)</span>{% endif %}
    </h1>
    <div class="row"><span class="label">Username</span><span>{{ acc['username'] }}</span></div>
    <div class="row"><span class="label">Balance</span><span>${{ acc['balance'] }}</span></div>
    <div class="row"><span class="label">Secret</span><span>{{ acc['secret'] }}</span></div>
    <p><a href="{{ url_for('logout') }}">Log out</a></p>
  </div>
</body>
</html>

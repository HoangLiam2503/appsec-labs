# VulnBoard lab-02 — XSS
# Vulnerable build on :3000, fixed build on :3001.
services:
  vuln:
    build:
      context: .
    environment:
      BUILD: app
      PORT: 3000
    ports:
      - "3000:3000"

  fixed:
    build:
      context: .
    environment:
      BUILD: fixed
      PORT: 3001
    ports:
      - "3001:3001"

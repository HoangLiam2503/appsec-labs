<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VulnBank — Login</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;
         display:grid;place-items:center;height:100vh;margin:0}
    .card{background:#1e293b;padding:2rem;border-radius:12px;width:300px}
    h1{font-size:1.2rem;margin-top:0}
    input{width:100%;padding:.6rem;margin:.4rem 0;border-radius:6px;border:none;
          box-sizing:border-box}
    button{width:100%;padding:.6rem;border:none;border-radius:6px;
           background:#3b82f6;color:#fff;font-weight:600;cursor:pointer}
    .err{color:#f87171;font-size:.85rem}
    .note{color:#64748b;font-size:.75rem;margin-top:1rem}
  </style>
</head>
<body>
  <div class="card">
    <h1>🏦 VulnBank</h1>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post">
      <input name="username" placeholder="Username" autofocus>
      <input name="password" type="password" placeholder="Password">
      <button type="submit">Log in</button>
    </form>
    <p class="note">Lab target — for authorized testing only.</p>
  </div>
</body>
</html>
